name: Deploy naar GitHub Pages

on:
  push:
    branches: [claude/taskflow-webapp-subagents-mxc0yz]
  workflow_dispatch:

# Nodig voor de officiële Pages-deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; een nieuwe push annuleert een lopende run niet halverwege
# maar wacht netjes, zodat de live site nooit half gepubliceerd raakt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Dezelfde checks als lokaal, zodat een kapotte build nooit live gaat.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - run: npm run build -- --mode gh-pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
